experiment_name: weak_color_edge_w20_dualema
seed: 42
total_steps: 20000

batch_size: 1024
micro_batch: 128

lr: 0.0001
betas: [0.9, 0.95]
warmup_steps: 480

time_mean: -0.4
time_std: 1.0

norm_p: 1.0
norm_eps: 0.01

features: 128
color_loss_share: 0.5
spatial_scale: 1.0
time_scale: 1.0
lambda_off: 20.0

ema_decay: 0.9999
ema_decay_099: 0.99

log_every: 200
save_every: 1000
snapshot_steps: [2000, 5000, 10000, 20000]

data_root: /data/cifar10
output_root: /outputs/weak_mean_flow
download: false

model:
  img_resolution: 32
  in_channels: 3
  out_channels: 3
  model_channels: 128
  channel_mult: [2, 2, 2]
  channel_mult_emb: 4
  channel_mult_noise: 2
  num_blocks: 4
  attn_resolutions: [16]
  resample_filter: [1, 3, 3, 1]
  dropout: 0.0
  augment_dim: 0

evaluation:
  nfe_list: [1, 4, 16]
  fid_samples: 10000
  batch_size: 64
  seed: 42
